# Build the hot-seat page and publish it to GitHub Pages.
#
# The deploy is gated on the suite and the typechecker: a board that validates
# can still be unplayable, so the least this can do is refuse to ship a build
# that does not pass. web/ is the site — index.html, the default theme pack,
# and app.js, which is built here rather than committed.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22.6+ for --experimental-strip-types, which is how the suite runs the
      # TypeScript sources with no build step and no test-runner dependency.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
